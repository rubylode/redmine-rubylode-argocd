en:
  rubylode_argocd:
    status_page:
      title: Argo CD
    columns:
      app: App
      project: Project
      health: Health
      sync: Sync
      last_sync: Last sync
      revision: Revision
    time_ago: "%{time} ago"
    source_count:
      one: "1 source"
      other: "%{count} sources"
    failing_resource: "%{kind} %{name} %{health}: %{message}"
    failing_resource_without_message: "%{kind} %{name} %{health}"
    detail_skipped: "Detail skipped: too many apps need a look"
    settings_page:
      column_left: Left
      column_right: Right
      variable_line: "%{name}: %{variable} is %{state}"
      variable_is_not_allowed: "not allowed: the name must start with ARGOCD_"
      variable_is_set: "set in the environment"
      variable_is_not_set: "not set in the environment"
      placements_heading: Show the block on
      placements_intro: 'Besides the macro, the page and the My page block, the block can go on these pages. All of them follow "Who may see the block" and share one cache.'
    settings:
      instances:
        label: Instances
        hint: "One Argo CD per line: Name | address | token variable | link address. The variable is the name of an environment variable that holds an API token. The token is never saved here. Set it before Redmine starts. The name must start with ARGOCD_. The link address is optional: where people open Argo CD in their browser, when Redmine reaches it by an address a browser cannot, such as http://argocd-server.argocd.svc. Without it, app links use the address. Nothing is sent to the link address. Lines starting with # are ignored. Below the box you see whether each variable is set."
        example: |-
          Production | https://argocd.example.com | ARGOCD_PRODUCTION_TOKEN
          Cluster | http://argocd-server.argocd.svc | ARGOCD_CLUSTER_TOKEN | https://argocd.example.com
      allow_plain_http:
        label: Allow plain http
        hint: "Check this only when Argo CD is on a network you trust. The token then travels unencrypted."
      apps_to_show:
        label: Apps to show
        hint: "One app per line: Instance | app name | Label. The label may be empty. Empty means every app each instance has. Lines starting with # are ignored."
        example: |-
          Production | billing-api | Billing
      cache_seconds:
        label: Cache seconds
        hint: "Each Argo CD is asked at most once in this many seconds."
      failure_cache_seconds:
        label: Failure cache seconds
        hint: "After a failed answer, that Argo CD is left alone for this many seconds."
      timeout_seconds:
        label: Timeout seconds
        hint: "A request to Argo CD is given up after this many seconds."
      block_title:
        label: Block title
        hint: "The heading of the block and the name of the top menu link."
      visibility:
        label: Who may see the block
        logged_in: Everyone who is signed in
        admins: Administrators only
      show_on_welcome_page:
        label: Welcome page
        hint: "Adds the block to Redmine's home page for the people who may see it."
      welcome_page_column:
        label: Column
      show_on_my_page:
        label: My page
        hint: "Adds the block to the default My page, for people who have not arranged their own. Everyone can still add it from the block list."
      show_on_project_overview:
        label: Project Overview page
        hint: "Adds the block to every project's Overview page."
      project_overview_column:
        label: Column
      show_on_matching_pages:
        label: Pages matching these paths
        hint: "Adds a small version of the block to each page whose path matches one of the paths below."
      matching_page_paths:
        label: Paths
        hint: "One path per line, starting with /. * stands for anything inside one path segment, ** for anything. A query string and a trailing slash are ignored. /admin, /settings, /login and /account match only a path that starts with that prefix."
        example: |-
          /issues
          /projects/*/issues
      show_in_top_menu:
        label: Show in the top menu
        hint: "Adds a link to /status/argocd to the top menu, for the people who may see the block."
    summary:
      no_apps: No apps to show
      all_fine:
        one: "All 1 app healthy and synced"
        other: "All %{count} apps healthy and synced"
      need_attention: "%{attention} of %{total} need attention"
      unavailable_instances:
        one: "1 instance is unavailable and its apps are not counted."
        other: "%{count} instances are unavailable and their apps are not counted."
    unknown_apps: "Not found in %{instance}: %{apps}"
    status:
      unavailable: Status unavailable
      not_set_up: Argo CD is not set up yet
    hints:
      reason: "Why: %{reason}"
      not_configured: "The block is not set up yet. Add an Argo CD instance in the plugin settings."
      not_configured_link: Open the settings
    widget:
      need_attention:
        one: "%{count} needs attention"
        other: "%{count} need attention"
    status_plugin:
      missing_html: "Install %{link} to see this with the other status blocks on one page."
      installed_html: "Rubylode Status is installed, so this block shows on the %{link}."
      status_page: Status page
    errors:
      line_field_count: "needs %{count} fields separated by |, found %{found}"
      line_name_missing: the name is empty
      line_name_duplicate: "the name %{name} is already used"
      instance_line_prefix: "Instances, line %{line_number}: %{message}"
      app_line_prefix: "Apps to show, line %{line_number}: %{message}"
      app_line_field_count: "needs at least 2 fields separated by |: Instance | app name | Label"
      app_line_unknown_instance: "no instance named %{name} in Instances"
      address_invalid: "the address must start with http:// or https:// and name a host"
      environment_variable_invalid: "the token variable must start with ARGOCD_ and use only capital letters, digits and underscores. Redmine's own secrets cannot be named here."
      plain_http_refused: 'a plain http:// address is only accepted for localhost. Use https://, or check "Allow plain http" if Argo CD is on a network you trust.'
      number_invalid: "%{field} must be a whole number of at least %{minimum}"
      column_invalid: The column must be Left or Right
      visibility_invalid: Who may see the block must be one of the listed choices
      block_title_blank: The block title cannot be empty
      path_line_prefix: "Pages matching these paths, line %{line_number}: %{message}"
      token_missing: "No token for %{name}"
      token_has_line_break: "The token for %{name} contains a line break, so it is not sent"
      insecure_connection: 'The Argo CD address is not https, so the token is not sent. Use https://, or check "Allow plain http".'
      redirect_refused: "Argo CD redirected to another address, so the token was not sent there"
      argocd_status: "Argo CD answered %{status}"
      answer_too_large: "Argo CD's answer was too large"
      address_has_extras: "the address must be only a scheme, a host and a port, without a user name, a query or a fragment"
      link_address_invalid: "the link address must start with http:// or https:// and name a host"
      link_address_has_extras: "the link address must be only a scheme, a host, a port and a path, without a user name, a query or a fragment"
      answer_unreadable: "Argo CD's answer could not be read"
      unreachable: "Argo CD could not be reached (%{error_class})"
      argocd_did_not_answer: Argo CD did not answer
      path_must_start_with_slash: "a path must start with / (for example /issues)"
      path_has_host: "give the path only, without http:// or a host name"
      path_has_query: "leave out the ? and # parts; query strings are ignored"
      path_has_space: "a path cannot contain spaces"
      path_too_long: "a path can have at most %{maximum} characters"
      path_too_many: "at most %{maximum} paths can be listed"
  my:
    blocks:
      rubylode_argocd_status: Argo CD
