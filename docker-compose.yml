# Runs the plugin's tests in a Redmine 7 image. Tests: ruby bin/test (runs the "test" service below)
services:
  test:
    build:
      context: .
      dockerfile: docker/test.Dockerfile
    profiles: ["test"]
    environment:
      RAILS_ENV: test
    volumes:
      - .:/usr/src/redmine/plugins/redmine_rubylode_argocd
